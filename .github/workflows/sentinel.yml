name: Sentinel security audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: python -m pip install '.[dev]'
      - run: sentinel scan ./examples/vulnerable_reentrancy --mock --output ./reports
      - name: Export SARIF and evaluate release policy
        run: |
          ledger=$(find reports -name 'sentinel-report-*.json' | head -1)
          sentinel gate "$ledger" --sarif reports/sentinel.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/sentinel.sarif
